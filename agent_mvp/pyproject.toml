[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-research-agent"
version = "2.0.0"
description = "A constrained natural-language compiler for Vantage6 research tasks"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "jsonschema>=4.18,<5", "rich>=14.1,<15", "prompt-toolkit>=3.0.52,<4"]

[project.optional-dependencies]
sdk = ["openai-agents==0.22.2", "openai==3.14.1", "httpx2==2.13.0"]
live = ["vantage6-client==4.15.0", "matplotlib>=3.8,<4"]
registry = ["cryptography>=42"]
mcp = ["mcp>=2.2,<3"]
dev = ["ruff>=0.15,<0.16"]

[project.scripts]
federated-agent = "federated_agent.cli:main"
federated-agent-mcp = "federated_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
federated_agent = ["templates/*.tpl", "data/catalogs/*.json", "data/catalogs/*.jsonld", "data/config/*.json"]

[tool.ruff]
line-length = 140
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Syntax errors, undefined names and unused code. Style rules are deliberately not enforced.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]
